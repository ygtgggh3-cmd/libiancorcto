name: Build LIBIAN TV ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE' ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Validate project files (fast fail)
        run: |
          set -e
          python3 -m py_compile config/includes.chroot/usr/local/bin/libian-tv
          for f in auto/config auto/clean scripts/*.sh \
                   config/hooks/live/*.hook.chroot \
                   config/includes.chroot/usr/local/bin/libian-tv-session \
                   config/includes.chroot/usr/local/bin/libian-tv-close \
                   config/includes.chroot/usr/local/lib/libian/autologin.sh; do
            bash -n "$f" && echo "syntax ok: $f"
          done
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/build.yml'))"
          chmod +x auto/config auto/clean scripts/*.sh config/hooks/live/*.hook.chroot \
                   config/includes.chroot/usr/local/bin/libian-tv \
                   config/includes.chroot/usr/local/bin/libian-tv-session \
                   config/includes.chroot/usr/local/bin/libian-tv-close \
                   config/includes.chroot/usr/local/lib/libian/autologin.sh

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Build ISO inside Debian trixie (live-build)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "## LIBIAN TV: resultado de la compilación" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          sudo docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            -e GITHUB_STEP_SUMMARY=/work/summary.md -e GITHUB_TOKEN \
            debian:trixie bash scripts/build.sh 2>&1 | tee docker.log
          sudo chown -R "$(id -u):$(id -g)" . || true

      - name: Publish summary
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Report build failure (readable in annotations)
        if: failure()
        run: |
          # Las últimas líneas del registro, como anotación de error.
          for n in 1; do
            msg=$(tail -n 40 docker.log 2>/dev/null | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Fallo de compilacion (ultimas lineas)::${msg}"
          done
          grep -n -i -E 'ERROR|E: |SELFCHECK|FALL' docker.log 2>/dev/null | tail -n 15 | tr -d '\r' | while IFS= read -r l; do
            echo "::warning::$(printf '%s' "$l" | sed -e 's/%/%25/g' | cut -c1-400)"
          done

      - name: Show ISO
        run: |
          ls -lh output/
          cat output/SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: libian-tv-iso
          path: |
            output/libian-tv-amd64.iso
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libian-tv-build-log
          path: |
            build.log
            docker.log
            output/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Boot smoke test (QEMU, 3 GB RAM)
        id: smoke
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 imagemagick libarchive-tools xorriso
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          bash scripts/smoke-test.sh output/libian-tv-amd64.iso smoke 1200

      - name: Report smoke-test details (readable in annotations)
        if: always()
        run: |
          if [ -f smoke/serial.log ]; then
            msg=$(grep -E 'LIBIAN-TV|libian-tv-session' smoke/serial.log | tail -n 15 | cut -c1-500 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Prueba de arranque (marcas LIBIAN TV)::${msg:-sin marcas}"
          fi

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libian-tv-smoke-test
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final status
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "### Prueba de arranque: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Prueba de arranque: FALLÓ o no se ejecutó. La ISO existe y es estructuralmente válida, pero NO está confirmado que arranque. Revisa el artefacto libian-tv-smoke-test." >> "$GITHUB_STEP_SUMMARY"
          fi
